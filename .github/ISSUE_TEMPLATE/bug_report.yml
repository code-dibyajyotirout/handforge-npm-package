name: Bug Report
description: Create a report to help us improve HandForge
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem in HandForge.
  - type: input
    id: version
    attributes:
      label: Package Version
      description: What version of handforge are you using?
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or code snippet to reproduce the behavior.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, GPU model.
      placeholder: Linux Ubuntu 22.04, Chrome 124, WebGPU enabled
    validations:
      required: true
