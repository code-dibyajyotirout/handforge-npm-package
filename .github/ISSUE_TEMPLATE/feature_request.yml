name: Feature Request
description: Suggest an idea or enhancement for HandForge
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an idea or architectural improvement for HandForge.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you have considered.
